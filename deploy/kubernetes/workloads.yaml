apiVersion: apps/v1
kind: Deployment
metadata:
  name: spectrum-analyzer
  namespace: myapps
  labels:
    app.kubernetes.io/name: spectrum-analyzer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: spectrum-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spectrum-analyzer
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/neoscrib/spectrum-analyzer
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spectrum-analyzer-api
  namespace: myapps
  labels:
    app.kubernetes.io/name: spectrum-analyzer-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: spectrum-analyzer-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spectrum-analyzer-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/neoscrib/spectrum-analyzer-api
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: :8081
            - name: RR_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: spectrum-analyzer-api
                  key: RR_APP_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/armer/aliases
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/armer/aliases
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/armer/aliases
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: spectrum-analyzer
  namespace: myapps
spec:
  selector:
    app.kubernetes.io/name: spectrum-analyzer
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: spectrum-analyzer-api
  namespace: myapps
spec:
  selector:
    app.kubernetes.io/name: spectrum-analyzer-api
  ports:
    - name: http
      port: 8081
      targetPort: http
