server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Permissions-Policy "usb=(self)" always;
    expires -1;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ^~ /api/ {
        expires off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $radio_reference_api http://api:8081;
        proxy_pass $radio_reference_api;
        proxy_set_header Host $http_host;
        proxy_read_timeout 25s;
        error_page 502 504 = @api_unavailable;
    }

    location @api_unavailable {
        expires off;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"error":"Start the RadioReference API with Docker Compose to enable lookup."}';
    }

    location ~ \.(js|css|wasm|webmanifest|png|svg|woff2?|gz|txt|md|c|sh)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
