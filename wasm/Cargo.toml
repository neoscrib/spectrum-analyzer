[package]
name = "spectrum-dsp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p25 = { package = "sdr-p25", version = "=0.1.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
