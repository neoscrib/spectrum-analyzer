[package]
name = "spectrum-dsp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["core", "wfm", "am", "wwv", "nfm", "ook", "armer"]
core = []
wfm = []
am = []
wwv = ["dep:serde", "dep:serde_json"]
nfm = ["dep:serde", "dep:serde_json"]
ook = ["dep:serde", "dep:serde_json"]
armer = ["dep:p25", "dep:serde", "dep:serde_json"]

[dependencies]
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
p25 = { package = "sdr-p25", version = "=0.1.0", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
